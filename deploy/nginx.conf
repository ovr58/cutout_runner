# Конфигурация nginx для сервиса выреза.
# Кладётся в /etc/nginx/conf.d/cutout-runner.conf — этот каталог включён внутрь http{},
# поэтому limit_req_zone и server{} могут жить в одном файле.
#
# Лимиты стоят здесь, а не в приложении: запрос, отбитый до Node, не занимает ни ядра,
# ни памяти инференса. Приложение слушает только 127.0.0.1 — наружу его выпускает
# исключительно этот файл (docs/TZ.md FR-13, NFR-03).
#
# ВСЕ значения ниже, помеченные TODO, — подставные. Настоящее доменное имя в публичный
# репозиторий не попадает.

# TODO(пользователь): частота вызовов. Инференс занимает 12–24 с, поэтому один вызывающий
# физически не сделает больше ~3 запросов в минуту; 30r/m — потолок «на всякий случай».
limit_req_zone $binary_remote_addr zone=cutout:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cutout.example.com;  # TODO(пользователь): настоящее доменное имя

    # Продление сертификата Let's Encrypt (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 намеренно не включён: клиент один и запрос за раз — мультиплексирование ничего
    # не даёт, а директива менялась между 1.24 и 1.25.1 и ломает конфигурацию не на той версии.
    server_name cutout.example.com;  # TODO(пользователь): настоящее доменное имя

    ssl_certificate     /etc/letsencrypt/live/cutout.example.com/fullchain.pem;   # TODO(пользователь)
    ssl_certificate_key /etc/letsencrypt/live/cutout.example.com/privkey.pem;     # TODO(пользователь)

    # Только TLS 1.2+ (docs/TZ.md NFR-03).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # TODO(пользователь): потолок тела. Кадр 1440×1920 в PNG — единицы мегабайт; 20m берётся
    # с запасом. Превышение отбивается здесь и превращается в 413 (docs/TZ.md US-E4).
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Живость проверяет и тот, кто секрета не знает: установщик, внешний монитор.
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /cutout {
        limit_req zone=cutout burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Тело буферизуется до передачи в Node: обрыв клиента на медленной загрузке не
        # должен занимать очередь инференса.
        proxy_request_buffering on;
        client_body_buffer_size 1m;

        # Инференс занимает 12–24 с и может ждать в очереди. Таймауты заведомо больше,
        # иначе работа делается впустую (docs/SPEC.md §10).
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Ничего, кроме двух маршрутов, наружу не открыто.
    location / {
        return 404;
    }
}
